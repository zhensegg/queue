[package]
name = "zhensegg"
version = "0.1.0"
edition = "2024"
description = "Zhensegg Queue - zero-copy offset broker with io_uring/thread-per-core"
license = "GPLv3"

[[bin]]
name = "zhensegg-broker"
path = "src/main.rs"

[dependencies]
bytes = "1.9"
parking_lot = "0.12"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
mimalloc = { version = "0.1.43", optional = true }
nix = { version = "0.29", features = ["fs"] }
libc = "0.2"
crossbeam-channel = "0.5"
socket2 = "0.5"
prometheus = { version = "0.13", features = ["process"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
dashmap = "5.5"
sysinfo = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

[dev-dependencies]
rcgen = "0.13"

[dependencies.monoio]
version = "0.2.4"
features = ["poll-io", "sync"]
optional = true

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.6"

[features]
default = []
mimalloc = ["dep:mimalloc"]
uring = ["dep:monoio"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
